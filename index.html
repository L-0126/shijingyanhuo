<body class="book-only book-initializing" data-edition="v10">

    <main id="main" tabindex="-1">
        <section id="landing" class="landing" hidden>
            <div class="hero-copy">
                <p class="eyebrow">从清晨面摊，翻到夜里的家门口</p>
                <h1>纸页翻开，<br>街坊都在。</h1>
                <p class="hero-intro">面摊刚支好，船正穿过桥洞。<br>茶铺里有人招呼坐下，<br>翻到最后一页，家里还留着饭。</p>
                <div class="hero-actions">
                    <button class="button primary" data-action="enter">翻开这本书 <span>↗</span></button>
                    <button class="text-button" data-action="catalog">从五章开始读 <span>↓</span></button>
                </div>
                <p class="hero-footnote">味、声、闲、艺、情 · 五章街巷里的原创故事</p>
            </div>
            <div class="hero-art">
                <div id="hero-slot" class="hero-slot"></div>
                <div class="hero-caption"><span>沿着街巷走，停在一个人身边。</span><span>市井百味志</span></div>
            </div>
            <div class="intro-strip"><span>写在翻开之前</span><p id="introduction"></p></div>
            <section id="catalog" class="catalog" aria-labelledby="catalog-title">

                        </button>
                    </div>
                </header>
                <div class="intro-tabs"></div>
                <div class="intro-content" tabindex="0" role="region" aria-label="五章长卷正文"></div>
